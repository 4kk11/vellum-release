# 公開用リポジトリ（4kk11/vellum-release）で動く。本体の plugin/scripts/release.mjs が毎回ここへ写す。
# タグが push されたら、そのタグのファイルで GitHub Release を作る（BRAT は Release の添付を読む）。
name: release
on:
  push:
    tags: ['*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release を作るタグ（自動で動かなかったときの手動用）'
        required: true
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          files="main.js manifest.json"
          [ -f styles.css ] && files="$files styles.css"
          gh release create "$TAG" $files --title "$TAG" --notes "Vellum $TAG" --verify-tag
